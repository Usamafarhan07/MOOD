<script id="tailwind-config">

    darkMode: "class",

      extend: {
        "colors": {
          "background": "#fcf9f4",
          "primary": "#442a22",
          "secondary": "#a04022",
          "secondary-container": "#fe8763",
          "surface": "#fcf9f4",
          "surface-container": "#f0ede9",

        "fontFamily": {
          "headline": ["Noto Serif"],
          "body": ["Manrope"],
          "label": ["Manrope"]
        }
      },
    },
  }
</script>
<style>
    body { font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }
    h1, h2, h3, h4, .font-serif { font-family: 'Noto Serif', serif; }
    .material-symbols-outlined {

<body class="bg-background text-on-background pb-32">

<header class="flex items-center justify-between px-6 py-6 bg-background/80 backdrop-blur-md sticky top-0 z-50" data-purpose="top-navigation">

</button>
<!-- Logo -->
<h1 class="text-2xl font-serif font-black tracking-[0.25em] text-primary uppercase ml-4">MOOD</h1>
<!-- Bag Icon -->
<button aria-label="View Cart" class="p-1"><div class="relative inline-flex">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
<span class="absolute -top-1.5 -right-1.5 flex h-4 w-4 items-center justify-center rounded-full bg-secondary text-[9px] font-bold text-white ring-2 ring-background">

  </span>
</div></button>
</header>

<div class="flex flex-col justify-between flex-grow py-1">

<div>
<h3 class="font-serif font-bold text-lg leading-tight text-primary">Toscana Leather Boot</h3>
<p class="text-on-surface-variant text-sm font-body mt-1">Charcoal / Large</p>

<h3 class="font-serif font-bold text-lg leading-tight text-primary">Wool Coat</h3>

<!-- BEGIN: SummarySection -->
<section class="mt-10 px-6" data-purpose="order-summary">
<div class="bg-surface-container-low rounded-lg p-6 space-y-4">
<div class="flex justify-between items-center text-on-surface-variant font-medium">
<span>Subtotal</span>
<span class="text-primary tabular-nums">LKR 24,000</span>
</div>
<div class="flex justify-between items-center text-on-surface-variant font-medium">
<span>Shipping</span>
<span class="text-secondary font-bold">LKR 0 (Complimentary)</span>
</div>
<div class="pt-4 border-t border-outline/20">

<span class="text-2xl font-serif font-bold text-primary">Total</span>

</div>
</div>

<button class="w-full bg-gradient-to-r from-secondary to-secondary-container text-white rounded-full py-6 flex items-center justify-center gap-4 transition-transform active:scale-[0.98] shadow-xl shadow-secondary/20">
<span class="text-sm font-bold uppercase tracking-[0.2em]">Checkout</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center text-[10px] text-outline font-bold tracking-widest mt-6 uppercase">

      </p>
</section>
<!-- END: CheckoutAction -->
</main>
<!-- BEGIN: BottomNavigation -->
<footer class="fixed bottom-0 left-0 right-0 bg-background/90 backdrop-blur-2xl px-6 pb-8 pt-4 flex items-center justify-between z-50 max-w-md mx-auto rounded-t-3xl shadow-[0_-4px_30px_rgba(68,42,34,0.05)]" data-purpose="bottom-nav">
<button class="flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-primary/40 group-hover:text-secondary transition-colors">home</span>
<span class="text-[10px] font-bold uppercase tracking-widest text-primary/40 group-hover:text-secondary transition-colors">Home</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-primary/40 group-hover:text-secondary transition-colors">search</span>
<span class="text-[10px] font-bold uppercase tracking-widest text-primary/40 group-hover:text-secondary transition-colors">Search</span>
</button>
<button class="flex flex-col items-center gap-1">
