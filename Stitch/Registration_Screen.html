<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MOOD | Register</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700;900&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#b1ccc9",
                    "surface-container": "#f0ede9",
                    "surface-dim": "#dcdad5",
                    "background": "#fcf9f4",
                    "on-primary-container": "#d4ada1",
                    "outline": "#827470",
                    "secondary-fixed": "#ffdbd1",
                    "on-tertiary-container": "#a0bab7",
                    "inverse-surface": "#31302d",
                    "surface-container-highest": "#e5e2dd",
                    "on-tertiary-fixed-variant": "#334b49",
                    "secondary": "#a04022",
                    "primary-container": "#5d4037",
                    "on-tertiary-fixed": "#061f1e",
                    "on-surface": "#1c1c19",
                    "on-error-container": "#93000a",
                    "surface-container-lowest": "#ffffff",
                    "error": "#ba1a1a",
                    "primary-fixed": "#ffdbd0",
                    "secondary-fixed-dim": "#ffb59f",
                    "inverse-primary": "#e7bdb1",
                    "tertiary-fixed": "#cde8e5",
                    "on-secondary-container": "#732004",
                    "error-container": "#ffdad6",
                    "tertiary-container": "#334b49",
                    "on-error": "#ffffff",
                    "on-primary": "#ffffff",
                    "outline-variant": "#d4c3be",
                    "primary": "#442a22",
                    "tertiary": "#1c3433",
                    "inverse-on-surface": "#f3f0eb",
                    "on-secondary": "#ffffff",
                    "surface-container-low": "#f6f3ee",
                    "on-secondary-fixed": "#3a0a00",
                    "on-primary-fixed-variant": "#5d4037",
                    "primary-fixed-dim": "#e7bdb1",
                    "on-tertiary": "#ffffff",
                    "surface-variant": "#e5e2dd",
                    "secondary-container": "#fe8763",
                    "on-surface-variant": "#504441",
                    "on-secondary-fixed-variant": "#80290c",
                    "on-primary-fixed": "#2c160e",
                    "surface": "#fcf9f4",
                    "surface-bright": "#fcf9f4",
                    "on-background": "#1c1c19",
                    "surface-tint": "#77574d",
                    "surface-container-high": "#ebe8e3"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Noto Serif"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        .font-serif { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar to match the nocturnal mood */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #fcf9f4; }
        ::-webkit-scrollbar-thumb { background: #d4c3be; border-radius: 10px; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-between selection:bg-secondary-fixed selection:text-on-secondary-fixed overflow-x-hidden">
<!-- Top Branding Anchor (Suppressed Shell, but brand element maintained as per identity) -->
<header class="w-full py-12 flex justify-center items-center">
<h1 class="font-headline font-bold text-4xl tracking-[0.25em] text-primary uppercase">MOOD</h1>
</header>
<!-- Main Registration Canvas -->
<main class="w-full max-w-md px-8 py-4 flex-grow flex flex-col justify-center animate-in fade-in duration-700">
<!-- Welcome Section -->
<div class="mb-12 text-center">
<h2 class="font-serif font-extrabold text-sm tracking-[0.3em] uppercase text-primary/60 mb-6">WELCOME TO MOOD</h2>
<h3 class="font-serif text-4xl font-bold tracking-tight text-primary mb-3">Create Account</h3>
<p class="font-body text-on-surface-variant/80 text-sm tracking-wide">Please enter your details to register.</p>
</div>
<!-- Registration Form -->
<form class="space-y-6">
<!-- Full Name Input -->
<div class="space-y-2">
<label class="block font-label text-[10px] font-bold tracking-[0.15em] text-primary uppercase px-4" for="fullname">FULL NAME</label>
<input class="w-full bg-surface-container-high border-none rounded-lg px-5 py-4 focus:ring-1 focus:ring-primary/10 focus:bg-surface-container-highest transition-all duration-300 placeholder:text-on-surface-variant/30 text-primary" id="fullname" name="fullname" placeholder="e.g. Julianne Moore" type="text"/>
</div>
<!-- Email Input -->
<div class="space-y-2">
<label class="block font-label text-[10px] font-bold tracking-[0.15em] text-primary uppercase px-4" for="email">EMAIL ADDRESS</label>
<input class="w-full bg-surface-container-high border-none rounded-lg px-5 py-4 focus:ring-1 focus:ring-primary/10 focus:bg-surface-container-highest transition-all duration-300 placeholder:text-on-surface-variant/30 text-primary" id="email" name="email" placeholder="hello@atelier-mood.com" type="email"/>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="block font-label text-[10px] font-bold tracking-[0.15em] text-primary uppercase px-4" for="password">PASSWORD</label>
<div class="relative">
<input class="w-full bg-surface-container-high border-none rounded-lg px-5 py-4 focus:ring-1 focus:ring-primary/10 focus:bg-surface-container-highest transition-all duration-300 placeholder:text-on-surface-variant/30 text-primary" id="password" name="password" placeholder="••••••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/40 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</div>
<!-- Terms & Privacy -->
<div class="flex items-start gap-4 pt-4 px-1">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded-md border-none bg-surface-container-high text-primary focus:ring-0 focus:ring-offset-0 cursor-pointer appearance-none checked:bg-primary transition-all duration-300" id="terms" name="terms" type="checkbox"/>
<span class="material-symbols-outlined absolute pointer-events-none text-white text-sm left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<label class="font-body text-xs text-on-surface-variant/70 leading-relaxed cursor-pointer select-none" for="terms">
                    I agree to the <span class="text-primary font-bold underline underline-offset-4 decoration-outline-variant/30">Terms of Service</span> and <span class="text-primary font-bold underline underline-offset-4 decoration-outline-variant/30">Privacy Policy</span>
</label>
</div>
<!-- Action Button -->
<div class="pt-8">
<button class="w-full bg-primary text-white font-label text-xs font-bold tracking-[0.2em] py-5 rounded-full hover:shadow-xl hover:shadow-primary/10 active:scale-[0.98] transition-all duration-300 uppercase" type="submit">
                    REGISTER
                </button>
</div>
</form>
<!-- Auxiliary Navigation -->
<div class="mt-12 text-center">
<a class="inline-block group" href="#">
<p class="font-body text-xs tracking-wider text-on-surface-variant/60 group-hover:text-primary transition-colors">
                    Already have an account? <span class="text-primary font-bold border-b border-primary/20 group-hover:border-primary transition-all ml-1">Back to Login</span>
</p>
</a>
</div>
</main>
<!-- Footer Copyright -->
<footer class="w-full py-12 flex flex-col items-center gap-8">
<!-- Visual Accent (Vertical White Space / No-Line Partition) -->
<div class="w-px h-16 bg-gradient-to-b from-transparent via-outline-variant/30 to-transparent"></div>
<p class="font-label text-[10px] tracking-[0.25em] text-primary/40 uppercase">
            © 2026 MOOD GLOBAL FASHION SPREADS
        </p>
<!-- Decorative Product Context (Ghostly background layer for atmospheric depth) -->
</footer>
</body></html>
