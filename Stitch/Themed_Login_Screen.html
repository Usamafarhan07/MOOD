<body class="bg-background text-on-background font-body min-h-screen flex flex-col items-center">
<!-- Top Navigation Suppression (Transactional Page) -->
<!-- Navigation shell suppressed per "Semantic Shell Mandate" for transactional/login screens -->
<main class="w-full max-w-md px-8 pt-20 pb-12 flex flex-col flex-grow items-center">
<!-- Brand Identity -->
<div class="mb-16">
<h1 class="font-headline font-bold text-4xl tracking-[0.25em] text-primary uppercase">MOOD</h1>
</div>
<!-- Hero Text -->
<div class="w-full text-center mb-12">
<h2 class="font-headline text-3xl font-medium tracking-tight text-primary mb-3">Welcome Back</h2>
<p class="font-body text-on-surface-variant text-sm tracking-wide">Please enter your details to sign in.</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-8">
<!-- Email Input -->
<div class="space-y-3">
<label class="block font-label text-[10px] font-bold tracking-[0.15em] text-on-surface-variant uppercase ml-1" for="email">
                    EMAIL ADDRESS
                </label>
<input class="w-full px-6 py-4 bg-surface-container-high border-none rounded-xl text-on-surface placeholder-on-surface-variant/40 focus:ring-1 focus:ring-primary/20 focus:bg-surface-container-highest transition-all duration-300" id="email" placeholder="Enter your email" type="email"/>
</div>
<!-- Password Input -->
<div class="space-y-3">
<div class="flex justify-between items-end px-1">
<label class="block font-label text-[10px] font-bold tracking-[0.15em] text-on-surface-variant uppercase" for="password">
                        PASSWORD
                    </label>
<a class="font-label text-[10px] font-bold tracking-wider text-secondary hover:opacity-80 transition-opacity uppercase" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="w-full px-6 py-4 bg-surface-container-high border-none rounded-xl text-on-surface placeholder-on-surface-variant/40 focus:ring-1 focus:ring-primary/20 focus:bg-surface-container-highest transition-all duration-300" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-primary" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Login Action -->
<div class="pt-4">
<button class="w-full bg-primary-container text-white font-label font-bold text-sm tracking-[0.1em] py-5 rounded-full hover:shadow-xl hover:opacity-95 transform active:scale-[0.98] transition-all duration-300 uppercase" type="submit">
                    LOGIN
                </button>
</div>
</form>
<!-- Divider -->
<div class="w-full flex items-center justify-center my-10 space-x-4">
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
<span class="font-label text-[9px] font-bold tracking-[0.2em] text-on-surface-variant/60 uppercase">OR CONTINUE WITH</span>
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
</div>
<!-- Social Logins -->
<div class="w-full space-y-4">
<button class="w-full flex items-center justify-center space-x-4 px-6 py-4 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 transition-all duration-300 shadow-sm">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label text-[11px] font-bold tracking-[0.1em] text-on-surface uppercase">CONTINUE WITH GOOGLE</span>
</button>

<footer class="w-full py-12 mt-auto bg-[#fcf9f4] flex flex-col items-center justify-center space-y-8 px-6">
